name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector build: migration 00008 needs CREATE EXTENSION vector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flightdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLIGHTDECK_TEST_DB: postgres://postgres:postgres@localhost:5432/flightdeck?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: sqlc vet
        if: hashFiles('sqlc.yaml') != ''
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          sqlc vet || echo "sqlc vet reported issues (non-fatal)"
        continue-on-error: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
