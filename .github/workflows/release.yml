name: Release

# Publishing flow: push a v* tag and, once the same gates as CI pass, a GitHub
# Release is created. Running instances poll the releases API (not raw tags),
# so a tag whose tests fail never becomes "available" — see internal/update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector build: migration 00008 needs CREATE EXTENSION vector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flightdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLIGHTDECK_TEST_DB: postgres://postgres:postgres@localhost:5432/flightdeck?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  release:
    name: Publish release
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
